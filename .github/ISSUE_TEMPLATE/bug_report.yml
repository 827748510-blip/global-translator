name: Bug 反馈 / Bug Report
description: 报告翻译异常、界面问题、权限故障或浏览器扩展问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述 / Summary
      description: 请简要描述发生了什么，以及你期望的正常行为是什么。
      placeholder: 例如：在飞书桌面端拖选英文句子松开鼠标后未弹出翻译卡片。
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: 涉及模块 / Area
      options:
        - 窗口透明覆盖层（Active Window Overlay）
        - 滑词翻译 / 提示词润色 / 代码解释（Selection Translate）
        - 快捷键截图翻译（Screenshot OCR）
        - Chrome 网页原地翻译（Browser Bridge）
        - 视频字幕 / 本地 Whisper 语音转写（Video Translate）
        - 设置面板 / 权限 / CLI / 启动保活
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: 翻译后端 / Backend
      options:
        - 本地模型（Ollama / Local OpenAI-compatible）
        - DeepSeek 云端（deepseek-flash）
        - 两种后端均复现
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 系统与环境信息 / Environment
      description: 芯片型号、macOS 版本、Global Translator 版本及目标应用名称（如有）
      placeholder: "Apple M4 / macOS 27.2 / v1.1.3 / Chrome 142"
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: 诊断输出 / Doctor Output（请确认不含个人路径）
      description: 请在终端运行 `global-translator doctor` 并粘贴输出，协助快速定位权限或后端问题。
      render: shell

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
      placeholder: |
        1. 打开 ...
        2. 选中 / 按下快捷键 ...
        3. 观察到 ...
    validations:
      required: true
