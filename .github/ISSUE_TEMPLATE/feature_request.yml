name: 功能建议 / Feature Request
description: 提议新增翻译后端、交互改进或跨应用适配建议
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点 / Problem or Use Case
      description: 你在什么场景下遇到了不便？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: 你希望新增怎样的开关、快捷键或后端能力？
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 隐私与权限影响（可选）/ Privacy Considerations
      description: 该功能是否涉及额外系统权限、网络请求或本地文件读写？
