<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; width: 260px; margin: 0; padding: 12px 14px; }
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin: 0 0 8px; }
  button { font-size: 12px; }
  #status { margin-top: 10px; font-size: 12px; color: #666; }
  #status.ok { color: #1a7f37; }
  #status.bad { color: #b42318; }
  #videoExtras { margin: 0 0 4px; }
  #videoHint, #sidecarName, #sidecarError { font-size: 11px; color: #666; margin: 6px 0 0; line-height: 1.4; }
  #sidecarError { color: #b42318; }
  #clearSidecar { margin-top: 6px; }
</style>
</head>
<body>
  <h1>Global Translator</h1>
  <label><input type="checkbox" id="enabled"> 启用网页整页翻译</label>
  <p id="videoHint">视频翻译开关在菜单栏设置，与「滑词翻译」同一行，默认关闭。</p>
  <div id="videoExtras" hidden>
    <button type="button" id="pickSidecar">选择本地字幕 (SRT/VTT)</button>
    <input type="file" id="sidecarFile" accept=".srt,.vtt,text/vtt" hidden>
    <div id="sidecarName"></div>
    <button type="button" id="clearSidecar" hidden>清除字幕文件</button>
    <p id="sidecarError"></p>
  </div>
  <div id="status">检查桌面端连接…</div>
  <script src="subtitle-cues.js"></script>
  <script src="popup.js"></script>
</body>
</html>
