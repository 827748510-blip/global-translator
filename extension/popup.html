<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Global Translator</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f5f5f7;
    --border: rgba(0, 0, 0, 0.12);
    --text-primary: #1d1d1f;
    --text-secondary: #5c5c63;
    --accent: #0071e3;
    --control-bg: #ffffff;
    --control-hover: #ececef;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #b42318;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e20;
      --surface: #2a2a2d;
      --border: rgba(255, 255, 255, 0.14);
      --text-primary: #f5f5f7;
      --text-secondary: #b4b4bb;
      --accent: #3898ff;
      --control-bg: #323236;
      --control-hover: #3c3c41;
      --ok: #4ade80;
      --warn: #facc15;
      --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    font-family: -apple-system, "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-width: 288px;
    max-width: 340px;
    width: 304px;
    margin: 0;
    padding: 12px;
    font-size: 13px;
    line-height: 1.45;
  }
  main {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  label.toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 30px;
    font-size: 13px;
    cursor: pointer;
    margin: 0;
  }
  label.toggle-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  button {
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    min-height: 30px;
    padding: 5px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--control-bg);
    color: var(--text-primary);
    cursor: pointer;
    transition: background-color 120ms ease, transform 120ms var(--ease-out);
  }
  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled) { background: var(--control-hover); }
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .hint {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0;
    line-height: 1.45;
  }
  #sidecarName {
    font-size: 12px;
    color: var(--text-secondary);
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  #videoExtras {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #sidecarName:empty,
  #sidecarError:empty {
    display: none;
  }
  #sidecarError {
    font-size: 12px;
    color: var(--bad);
    margin: 0;
    line-height: 1.4;
  }
  #status {
    font-size: 12px;
    color: var(--text-secondary);
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  #status.ok { color: var(--ok); }
  #status.warn { color: var(--warn); }
  #status.bad { color: var(--bad); }
  @media (prefers-reduced-motion: reduce) {
    button { transition: none; }
    button:active:not(:disabled) { transform: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>Global Translator</h1>
    <section class="card" aria-label="网页与视频翻译开关">
      <label class="toggle-row" for="enabled">
        <span>启用网页整页翻译</span>
        <input type="checkbox" id="enabled">
      </label>
      <label class="toggle-row" for="videoTranslateToggle">
        <span>启用视频字幕叠中文</span>
        <input type="checkbox" id="videoTranslateToggle">
      </label>
      <p id="videoHint" class="hint">可在此直接切换视频字幕翻译；YouTube 请先开启播放器原生字幕。</p>
      <div id="videoExtras" hidden>
        <div class="btn-row">
          <button type="button" id="pickSidecar">加载本地字幕 (SRT/VTT)</button>
          <button type="button" id="clearSidecar" hidden>清除字幕</button>
        </div>
        <input type="file" id="sidecarFile" accept=".srt,.vtt,text/vtt" hidden>
        <div id="sidecarName" role="status" aria-live="polite"></div>
        <p id="sidecarError" role="alert"></p>
      </div>
    </section>
    <div id="status" role="status" aria-live="polite">检查桌面端连接…</div>
  </main>
  <script src="subtitle-cues.js"></script>
  <script src="popup.js"></script>
</body>
</html>
